<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Безпека Поруч</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1a2e">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Безпека Поруч">

<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: #1a1a2e;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  #app-frame {
    border: none;
    width: 100%;
    height: 100%;
    display: block;
  }

  #splash {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #1a1a2e;
    color: #eee;
    z-index: 10;
    transition: opacity .4s ease;
  }
  #splash.hide { opacity: 0; pointer-events: none; }
  #splash img { width: 84px; height: 84px; border-radius: 20px; margin-bottom: 16px; }
  #splash p { font-size: 15px; opacity: .7; }

  #offline-banner {
    position: fixed;
    top: 0; left: 0; right: 0;
    background: #d33;
    color: #fff;
    text-align: center;
    padding: 8px;
    font-size: 14px;
    display: none;
    z-index: 20;
  }
  #offline-banner.show { display: block; }
</style>
</head>
<body>

<div id="offline-banner">Немає з'єднання з інтернетом. Дані можуть бути застарілими.</div>

<div id="splash">
  <img src="icons/icon-192.png" alt="Безпека Поруч">
  <p>Завантаження...</p>
</div>

<!-- ЗАМІНИ APP_URL нижче на свій лінк Google Apps Script -->
<iframe
  id="app-frame"
  src="https://script.google.com/macros/s/AKfycbziQDJWFNHtmOFvl8Avb75bFMyQljGZk234Nns4qLzQejQ6fPWEm6xR4zMHecz6Iebe/exec"
  allow="geolocation; camera"
  title="Безпека Поруч"
></iframe>

<script>
  const frame = document.getElementById('app-frame');
  const splash = document.getElementById('splash');
  const offlineBanner = document.getElementById('offline-banner');

  frame.addEventListener('load', () => {
    setTimeout(() => splash.classList.add('hide'), 300);
  });

  function updateOnlineStatus() {
    offlineBanner.classList.toggle('show', !navigator.onLine);
  }
  window.addEventListener('online', updateOnlineStatus);
  window.addEventListener('offline', updateOnlineStatus);
  updateOnlineStatus();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(console.error);
    });
  }
</script>

</body>
</html>
